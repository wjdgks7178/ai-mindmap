<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 개념 지도</title>
<meta name="description" content="AI 입문자를 위한 용어·개념 마인드맵. 노드를 누르면 설명·그림·예시가 열린다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f4ef; --panel: #fffdf8; --ink: #1d1c1a; --sub: #6b675f; --line: #ddd8cc; --soft: #ece8de;
  --accent: #c2410c; --link: #1f5fbf; --planned: #b9b3a6;
  --d-literacy: #0f766e; --d-automation: #b45309; --d-vibecoding: #7c3aed; --d-langgraph: #2563eb;
  --d-architecture: #be123c; --d-methodology: #4d7c0f; --d-multimodal: #a21caf; --d-root: #1d1c1a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --panel: #1c1b19; --ink: #ece8df; --sub: #a29d92; --line: #34322d; --soft: #26241f;
    --accent: #fb923c; --link: #7cb0ff; --planned: #5a564e;
    --d-literacy: #2dd4bf; --d-automation: #fbbf24; --d-vibecoding: #a78bfa; --d-langgraph: #60a5fa;
    --d-architecture: #fb7185; --d-methodology: #a3e635; --d-multimodal: #e879f9; --d-root: #ece8df;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --panel: #1c1b19; --ink: #ece8df; --sub: #a29d92; --line: #34322d; --soft: #26241f;
  --accent: #fb923c; --link: #7cb0ff; --planned: #5a564e;
  --d-literacy: #2dd4bf; --d-automation: #fbbf24; --d-vibecoding: #a78bfa; --d-langgraph: #60a5fa;
  --d-architecture: #fb7185; --d-methodology: #a3e635; --d-multimodal: #e879f9; --d-root: #ece8df;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans KR", system-ui, sans-serif; overflow: hidden; }
header { height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
header h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
header .stat { font-size: 12px; color: var(--sub); white-space: nowrap; }
#search { margin-left: auto; width: min(260px, 40vw); padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; }
#theme { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 9px; cursor: pointer; font: inherit; font-size: 13px; }
main { display: flex; height: calc(100% - 56px); }
#map { flex: 1; min-width: 0; position: relative; }
#map svg { width: 100%; height: 100%; display: block; cursor: grab; }
#map svg:active { cursor: grabbing; }
.legend { position: absolute; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--sub); max-width: 70%; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.link { fill: none; stroke: var(--line); stroke-width: 1.4; }
.node circle { stroke-width: 2; cursor: pointer; }
.node text { font-size: 13px; fill: var(--ink); cursor: pointer; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
.node.planned text { fill: var(--sub); }
.node.match text { font-weight: 700; fill: var(--accent); }
.node.active circle { stroke-width: 4; }
#panel { width: min(560px, 46vw); border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 22px 26px 60px; }
#panel .crumbs { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
#panel .crumbs a { color: var(--sub); text-decoration: none; cursor: pointer; }
#panel .crumbs a:hover { color: var(--ink); }
#panel .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 4px; color: #fff; margin-bottom: 10px; }
#close { display: none; }
article { line-height: 1.75; font-size: 15.5px; }
article h1 { font-size: 26px; line-height: 1.3; margin: 4px 0 14px; letter-spacing: -0.02em; }
article h2 { font-size: 18px; margin: 30px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
article h3 { font-size: 16px; margin: 22px 0 8px; }
article blockquote { margin: 0 0 18px; padding: 12px 16px; background: var(--soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; }
article blockquote p { margin: 0; }
article code { font-family: "JetBrains Mono", monospace; font-size: .88em; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
article pre { background: var(--soft); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
article pre code { background: none; padding: 0; }
article table { border-collapse: collapse; width: 100%; font-size: 14px; margin: 10px 0; display: block; overflow-x: auto; }
article th, article td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
article th { background: var(--soft); }
article a { color: var(--link); }
article .mermaid { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 14px 0; text-align: center; overflow-x: auto; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.chips button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.chips button.planned { color: var(--sub); border-style: dashed; }
.chips button:hover { border-color: var(--accent); }
.empty { color: var(--sub); }
.box { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); }
.box h4 { margin: 0 0 4px; font-size: 13px; color: var(--sub); font-weight: 500; }
@media (max-width: 820px) {
  header .stat { display: none; }
  #panel { position: fixed; inset: 56px 0 0 0; width: 100%; border-left: none; transform: translateY(100%); transition: transform .25s ease; z-index: 5; padding: 18px 16px 60px; }
  #panel.open { transform: none; }
  #close { display: inline-block; float: right; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .legend { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>AI 개념 지도</h1>
  <span class="stat" id="stat"></span>
  <input id="search" type="search" placeholder="용어 찾기 (예: 하네스)" autocomplete="off">
  <button id="theme" title="밝기 전환">◐</button>
</header>
<main>
  <div id="map"><div class="legend" id="legend"></div></div>
  <aside id="panel"><button id="close">닫기</button><div id="content"></div></aside>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
// 큰 가지(depth 1)는 루틴이 계속 늘린다. 이름은 graph.json에서 읽고, 색은 정해 둔 것이 없으면 id로 만든다.
const SHORT = { literacy: "리터러시", automation: "자동화", vibecoding: "바이브코딩", langgraph: "LangGraph",
  architecture: "아키텍처", methodology: "방법론", multimodal: "멀티모달" };
let DOMAIN_NAME = { root: "AI" };
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function hashColor(d) {
  let h = 0;
  for (const c of d) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 60% ${isDark() ? 68 : 36}%)`;
}
const color = d => css("--d-" + (d || "root")) || hashColor(d || "root");
let graph, byId, root, svg, g, zoom, activeId = null;

function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function initMermaid() {
  mermaid.initialize({ startOnLoad: false, theme: isDark() ? "dark" : "neutral", securityLevel: "strict", fontFamily: "IBM Plex Sans KR" });
}

async function load() {
  graph = await fetch("data/graph.json", { cache: "no-cache" }).then(r => r.json());
  byId = new Map(graph.nodes.map(n => [n.id, { ...n, kids: [] }]));
  for (const n of byId.values()) if (n.parent && byId.has(n.parent)) byId.get(n.parent).kids.push(n);
  const top = graph.nodes.find(n => !n.parent);
  for (const n of graph.nodes) if (top && n.parent === top.id) DOMAIN_NAME[n.id] = SHORT[n.id] || n.label;
  const done = graph.nodes.filter(n => n.status === "done").length;
  document.getElementById("stat").textContent = `노드 ${graph.nodes.length}개 · 정리 ${done}개 · ${graph.updated || ""}`;
  document.getElementById("legend").innerHTML = Object.entries(DOMAIN_NAME).filter(([k]) => k !== "root")
    .map(([k, v]) => `<span><i style="background:${color(k)}"></i>${v}</span>`).join("") +
    `<span><i style="background:${css("--planned")}"></i>정리 예정</span>`;
  initMermaid();
  draw();
  route();
}

function toHier(n, depth) {
  const node = { id: n.id, data: n, children: n.kids.map(k => toHier(k, depth + 1)) };
  if (depth >= 1 && !openSet.has(n.id)) { node._children = node.children; node.children = null; }
  return node;
}
const openSet = new Set();

function draw() {
  const el = document.getElementById("map");
  d3.select(el).select("svg").remove();
  svg = d3.select(el).insert("svg", ":first-child");
  g = svg.append("g");
  zoom = d3.zoom().scaleExtent([0.25, 2.5]).on("zoom", e => g.attr("transform", e.transform));
  svg.call(zoom);
  render(true);
}

function render(fit) {
  const top = graph.nodes.find(n => !n.parent);
  const h = d3.hierarchy(toHier(byId.get(top.id), 0), d => d.children);
  d3.tree().nodeSize([30, 190])(h);
  g.selectAll("*").remove();
  g.append("g").selectAll("path").data(h.links()).join("path").attr("class", "link")
    .attr("d", d3.linkHorizontal().x(d => d.y).y(d => d.x));
  const q = document.getElementById("search").value.trim().toLowerCase();
  const node = g.append("g").selectAll("g").data(h.descendants()).join("g")
    .attr("class", d => "node " + (d.data.data.status === "done" ? "" : "planned") +
      (q && match(d.data.data, q) ? " match" : "") + (d.data.id === activeId ? " active" : ""))
    .attr("transform", d => `translate(${d.y},${d.x})`)
    .on("click", (e, d) => { toggle(d.data.id); select(d.data.id); });
  node.append("circle")
    .attr("r", d => d.depth === 0 ? 9 : d.depth === 1 ? 7 : 5)
    .attr("fill", d => d.data.data.status === "done" ? color(d.data.data.domain) : css("--bg"))
    .attr("stroke", d => d.data.data.status === "done" ? color(d.data.data.domain) : css("--planned"));
  // 펼친 노드는 이름을 점 위에, 끝 노드는 오른쪽에 둔다(선과 겹치지 않게)
  const open = d => !!d.data.children && d.data.children.length;
  node.append("text")
    .attr("dy", d => open(d) ? "-0.9em" : "0.32em")
    .attr("x", d => open(d) ? 0 : 12)
    .attr("text-anchor", d => open(d) ? "middle" : "start")
    .text(d => d.data.data.label + (d.data._children ? ` (+${d.data._children.length})` : ""));
  if (fit) {
    const box = svg.node().getBoundingClientRect();
    const height = box.height || (window.innerHeight - 56);
    svg.call(zoom.transform, d3.zoomIdentity.translate(60, height / 2).scale(window.innerWidth < 820 ? 0.85 : 1));
  }
}

function match(n, q) { return (n.label + " " + (n.aka || []).join(" ") + " " + (n.summary || "")).toLowerCase().includes(q); }

function toggle(id) {
  const n = byId.get(id);
  if (!n.kids.length) return;
  openSet.has(id) ? openSet.delete(id) : openSet.add(id);
}
function openPath(id) {
  let n = byId.get(id);
  while (n && n.parent) { openSet.add(n.parent); n = byId.get(n.parent); }
}

async function select(id) {
  activeId = id;
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  openPath(id);
  render(false);
  const n = byId.get(id);
  const crumbs = [];
  for (let p = n; p; p = byId.get(p.parent)) crumbs.unshift(p);
  let body;
  if (n.status === "done") {
    const md = await fetch(`articles/${id}.md`, { cache: "no-cache" }).then(r => r.ok ? r.text() : "");
    body = md ? marked.parse(md.replace(/```mermaid\n([\s\S]*?)```/g, (_, c) => `<div class="mermaid">${c.replace(/</g, "&lt;")}</div>`))
              : `<p class="empty">글을 불러오지 못했다.</p>`;
  } else {
    body = `<h1>${esc(n.label)}</h1>` + (n.summary ? `<blockquote><p>${esc(n.summary)}</p></blockquote>` : "") +
      `<p class="empty">아직 정리 전인 노드다. 점심 루틴이 순서대로 채운다.</p>`;
  }
  const chip = x => `<button class="${x.status === "done" ? "" : "planned"}" data-id="${x.id}">${esc(x.label)}</button>`;
  const related = (n.related || []).map(r => byId.get(r)).filter(Boolean);
  document.getElementById("content").innerHTML =
    `<div class="crumbs">${crumbs.map(c => `<a data-id="${c.id}">${esc(c.label)}</a>`).join(" › ")}</div>` +
    `<span class="tag" style="background:${color(n.domain)}">${DOMAIN_NAME[n.domain] || n.domain}</span>` +
    `<article>${body}</article>` +
    (n.kids.length ? `<div class="box"><h4>뻗어 나간 가지</h4><div class="chips">${n.kids.map(chip).join("")}</div></div>` : "") +
    (related.length ? `<div class="box"><h4>함께 보면 좋은 노드</h4><div class="chips">${related.map(chip).join("")}</div></div>` : "");
  document.querySelectorAll("#content [data-id]").forEach(b => b.onclick = () => select(b.dataset.id));
  document.querySelectorAll("#content article a[href^='#']").forEach(a => a.onclick = e => { e.preventDefault(); select(a.getAttribute("href").slice(1)); });
  try { await mermaid.run({ querySelector: "#content .mermaid" }); } catch (e) { console.warn(e); }
  const panel = document.getElementById("panel");
  panel.classList.add("open");
  panel.scrollTop = 0;
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  select(byId.has(id) ? id : graph.nodes.find(n => !n.parent).id);
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (q) for (const n of byId.values()) if (match(n, q)) openPath(n.id);
  render(false);
});
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim().toLowerCase();
  const hit = [...byId.values()].find(n => match(n, q));
  if (hit) select(hit.id);
});
document.getElementById("close").onclick = () => document.getElementById("panel").classList.remove("open");
document.getElementById("theme").onclick = () => {
  document.documentElement.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("theme", document.documentElement.dataset.theme); } catch (e) {}
  initMermaid(); render(false); if (activeId) select(activeId);
};
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
window.addEventListener("hashchange", route);
load();
</script>
</body>
</html>
